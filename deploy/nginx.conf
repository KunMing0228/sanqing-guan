# WebSocket 反代配置。
# compose 里 upstream 用服务名 sanqing；若 Nginx 直接装在宿主机，改成 127.0.0.1:8080。
# TLS：把 443 server 块加上并把 80 重定向，证书用 certbot 或云厂商证书。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream sanqing_backend {
    server sanqing:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 按需换成自己的域名；国内服务器需先完成 ICP 备案
    # server_name guan.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://sanqing_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接：默认 60s 会被断开，必须放宽
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://sanqing_backend;
        access_log off;
    }

    # 可选：Nginx 装了 geoip2 模块时，把地名通过头传给 Node
    # proxy_set_header X-Geo-Country $geoip2_data_country_name;
    # proxy_set_header X-Geo-Province $geoip2_data_subdivision_name;
    # proxy_set_header X-Geo-City $geoip2_data_city_name;
}
